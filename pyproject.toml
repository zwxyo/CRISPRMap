[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisprmap"
version = "0.1.0"
description = "Local CRISPR spacer array, prevalence, similarity and network visualization"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = ["matplotlib>=3.6", "numpy>=1.23", "networkx>=3.0"]

[project.scripts]
crisprmap = "crisprmap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crisprmap*"]

